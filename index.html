<style>
:root{
  --green:#3d8b37; --green-d:#2f6e2a; --dark:#1a1a1a; --red:#c0392b; --blue:#1b3a8c;
  --bg:#f2f2f7; --card:#ffffff; --line:#e2e2ea; --muted:#8a8a8e; --muted2:#6c6c70;
  --shadow:0 1px 3px rgba(0,0,0,.08); --radius:14px;
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--dark);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%;overscroll-behavior-y:contain;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea,select{font-family:inherit;font-size:16px;}
a{color:var(--green);}
.hidden{display:none !important;}

/* ---------- App shell ---------- */
#app{max-width:760px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line);padding:calc(var(--safe-t) + 10px) 16px 10px;}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:38px;}
.brand{font-size:20px;font-weight:800;letter-spacing:-.5px;}
.brand .eco{color:var(--dark);}.brand .shield{color:var(--green);}
.brand small{display:block;font-size:12px;font-weight:600;color:var(--green);letter-spacing:0;margin-top:-2px;}
.btn-back{font-size:16px;font-weight:600;color:var(--green);display:flex;align-items:center;gap:3px;padding:6px 4px;margin-left:-4px;}
.btn-new{background:var(--green);color:#fff;font-weight:700;font-size:15px;padding:9px 16px;border-radius:999px;box-shadow:var(--shadow);}
.btn-new:active{background:var(--green-d);}
.title-lg{font-size:15px;font-weight:700;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px;}
.content{flex:1;padding:14px 16px calc(var(--safe-b) + 90px);}

/* ---------- Search ---------- */
.search-wrap{position:relative;margin-bottom:18px;}
.search{width:100%;padding:13px 14px 13px 40px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);box-shadow:var(--shadow);outline:none;}
.search:focus{border-color:var(--green);}
.search-ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px;}

.section-label{font-size:13px;font-weight:700;color:var(--muted2);letter-spacing:.5px;
  text-transform:uppercase;margin:6px 2px 10px;}

/* ---------- Inspection cards ---------- */
.card-list{display:flex;flex-direction:column;gap:10px;}
.insp-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:14px;display:flex;align-items:center;gap:12px;border:1px solid transparent;transition:transform .06s;}
.insp-card:active{transform:scale(.985);}
.insp-main{flex:1;min-width:0;}
.insp-name{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.insp-addr{color:var(--muted2);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.insp-meta{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap;}
.chip{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:#eef4ee;color:var(--green-d);}
.chip.gray{background:#eee;color:var(--muted2);}
.chip.amber{background:#fff3e0;color:#b35900;}
.chip.blue{background:#e8eefc;color:var(--blue);}
.insp-date{font-size:12px;color:var(--muted);}
.count-dots{display:flex;gap:5px;margin-top:6px;}
.count-dots span{font-size:11px;color:var(--muted2);display:flex;align-items:center;gap:3px;}
.chev{color:#c4c4cc;font-size:20px;flex-shrink:0;}

.empty{text-align:center;color:var(--muted);padding:60px 20px;}
.empty .big{font-size:46px;margin-bottom:10px;}
.empty .sub{font-size:14px;margin-top:6px;}

/* ---------- Detail tabs ---------- */
.tabs{display:flex;gap:6px;background:#e6e6ec;padding:4px;border-radius:11px;margin-bottom:16px;position:sticky;top:0;z-index:5;}
.tab{flex:1;text-align:center;font-size:13px;font-weight:600;padding:8px 4px;border-radius:8px;color:var(--muted2);}
.tab.active{background:var(--card);color:var(--dark);box-shadow:var(--shadow);}

.panel{display:flex;flex-direction:column;gap:14px;}
.field-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;}
.field-card h3{margin:0 0 10px;font-size:13px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted2);}
.fl{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.fl:last-child{margin-bottom:0;}
.fl label{font-size:13px;font-weight:600;color:var(--muted2);}
.fl input,.fl textarea,.fl select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fafafa;outline:none;}
.fl input:focus,.fl textarea:focus,.fl select:focus{border-color:var(--green);background:#fff;}
.fl textarea{resize:vertical;min-height:70px;}
.fl-row{display:flex;gap:10px;}
.fl-row .fl{flex:1;}

/* ---------- Checklist ---------- */
.cl-group{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.cl-head{padding:13px 14px;font-weight:700;font-size:14px;letter-spacing:.3px;text-transform:uppercase;
  background:var(--green);color:#fff;display:flex;justify-content:space-between;align-items:center;}
.cl-head .pct{font-size:12px;font-weight:600;background:rgba(255,255,255,.22);padding:2px 8px;border-radius:999px;}
.cl-item{padding:11px 14px;border-bottom:1px solid var(--line);}
.cl-item:last-child{border-bottom:none;}
.cl-q{font-size:14px;font-weight:600;margin-bottom:8px;}
.cl-controls{display:flex;flex-wrap:wrap;gap:7px;align-items:center;}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;}
.seg button{padding:7px 14px;font-size:13px;font-weight:600;color:var(--muted2);background:#fafafa;border-right:1px solid var(--line);}
.seg button:last-child{border-right:none;}
.seg button.on-yes{background:var(--green);color:#fff;}
.seg button.on-no{background:var(--red);color:#fff;}
.seg button.on-na{background:#8a8a8e;color:#fff;}
.seg button.on-gen{background:var(--blue);color:#fff;}
.cl-text{flex:1;min-width:130px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fafafa;}
.cl-text:focus{border-color:var(--green);background:#fff;outline:none;}

/* ---------- Photos ---------- */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.photo-cell{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#e6e6ec;}
.photo-cell img{width:100%;height:100%;object-fit:cover;display:block;}
.photo-cell .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.6));
  color:#fff;font-size:10px;padding:10px 5px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.photo-del{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);
  color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1;}
.add-photo{aspect-ratio:1;border:2px dashed #c4c4cc;border-radius:10px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;color:var(--muted2);font-size:13px;font-weight:600;gap:3px;background:#fafafa;}
.add-photo .plus{font-size:28px;line-height:1;}

/* ---------- Graph slot ---------- */
.graph-slot{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;text-align:center;}
.graph-frame{width:100%;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;margin-bottom:12px;}
.graph-frame iframe{width:100%;height:420px;border:none;display:block;}
.btn-line{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.btn{padding:11px 18px;border-radius:11px;font-weight:700;font-size:14px;box-shadow:var(--shadow);}
.btn-primary{background:var(--green);color:#fff;}.btn-primary:active{background:var(--green-d);}
.btn-ghost{background:#eef0f4;color:var(--dark);}
.btn-danger{background:#fdecea;color:var(--red);}
.btn-wide{width:100%;justify-content:center;text-align:center;}
.note-help{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5;}

/* ---------- FAB ---------- */
.fab-bar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 16px calc(var(--safe-b) + 10px);
  background:linear-gradient(transparent,rgba(242,242,247,.9) 30%);display:flex;gap:10px;max-width:760px;margin:0 auto;}
.fab-bar .btn{flex:1;}

/* ---------- Toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 84px);transform:translateX(-50%) translateY(20px);
  background:#1a1a1aee;color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:.25s;z-index:200;white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;display:none;
  align-items:flex-end;justify-content:center;}
.overlay.show{display:flex;}
.sheet{background:var(--card);width:100%;max-width:760px;border-radius:18px 18px 0 0;padding:20px 18px calc(var(--safe-b) + 18px);
  animation:slideUp .22s ease;}
@keyframes slideUp{from{transform:translateY(40px);opacity:.5;}to{transform:translateY(0);opacity:1;}}
.sheet h3{margin:0 0 14px;font-size:18px;}
.sheet .fl{margin-bottom:14px;}
.sheet-actions{display:flex;gap:10px;margin-top:6px;}
.sheet-actions .btn{flex:1;}
.import-hint{font-size:12px;color:var(--muted);margin-top:8px;}
.code-area{width:100%;min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:12px;}
</style>
</head>
<body>
<div id="app">
  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-row" id="topbarRow"></div>
  </div>

</div>

<!-- FAB (list view export/import) -->

<div id="pdfProg" style="position:fixed;inset:0;background:rgba(255,255,255,.82);backdrop-filter:blur(4px);z-index:400;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;">
  <div style="width:42px;height:42px;border:4px solid #d8d8de;border-top-color:#3d8b37;border-radius:50%;animation:spin 0.8s linear infinite;"></div>

<script>
window.onerror = function(msg, src, line, col, err){
  try{
    var c = document.getElementById('content') || document.body;
    c.innerHTML = '<div style="padding:20px;font-family:monospace;font-size:13px;color:#c0392b;line-height:1.5">'
      + '<b>JS ERROR (caught):</b><br>' + String(msg)
      + '<br>line ' + line + ':' + col
      + '<br><br><span style="color:#666">Screenshot this and send it.</span></div>';
  }catch(e){}
  return false;
};
window.addEventListener('unhandledrejection', function(e){
  try{
    var c = document.getElementById('content') || document.body;
    c.innerHTML = '<div style="padding:20px;font-family:monospace;font-size:13px;color:#c0392b;line-height:1.5">'
      + '<b>PROMISE ERROR (caught):</b><br>' + String(e.reason && (e.reason.message||e.reason))
      + '<br><br><span style="color:#666">Screenshot this and send it.</span></div>';
  }catch(err){}
});
</script>
<script>
"use strict";
/* beacon: prove the script started executing */
try{ var _c=document.getElementById('content'); if(_c) _c.innerHTML='<div style="padding:30px;color:#888;font-family:sans-serif">Loading…</div>'; }catch(e){}
/* =========================================================================
   EcoShield Inspection Hub — single-file PWA
   Storage: localStorage (on-device).  Backup: JSON export/import.
   Photos: compressed to dataURL.  Graph: full WDI HTML stored per job.
   ========================================================================= */

const STORE_KEY = 'ecoshield_hub_v1';
const INSPECTOR = 'Kasey Carroll SP29546';
const LICENSE = '100632';

/* ---- Checklist template (from BSP Checklist) ----
   type: yn (Yes/No/NA segmented), ynonly (Yes/No/NA), text, num, choice
*/
const CHECKLIST_TEMPLATE = [
 {group:'Exclusions', items:[
   {id:'ex_garage', q:'Garage seal measurements', type:'text'},
   {id:'ex_slope', q:'Property sloped / pitch added?', type:'yn'},
   {id:'ex_ptype', q:'Property type', type:'choice', opts:['1 Story','2 Story','3 Story']},
   {id:'ex_gable', q:'# of gable vents', type:'num'},
   {id:'ex_gutter', q:'Gutters', type:'choice', opts:['Clean','Have Gutter Guards']},
   {id:'ex_holes', q:'Upload all holes to address', type:'text'},
 ]},
 {group:'Attic', items:[
   {id:'at_tent', q:'Attic tent measurements', type:'text'},
   {id:'at_pic', q:'Picture of attic / clutter?', type:'yn'},
   {id:'at_dump', q:'Need dumpster?', type:'yn'},
   {id:'at_moving', q:'Client moving items out?', type:'yn'},
   {id:'at_movecharge', q:'Moving charge ($)', type:'num'},
   {id:'at_throw', q:'Throwing all items away?', type:'yn'},
   {id:'at_disinfect', q:'Disinfecting?', type:'yn'},
   {id:'at_bats', q:'Bats/live animals present?', type:'yn'},
 ]},
 {group:'Termite Control', items:[
   {id:'tc_concrete', q:'Concrete/stone issues (20+ ft impact)?', type:'yn'},
   {id:'tc_drill', q:'Need drilling for concrete?', type:'yn'},
   {id:'tc_linear', q:'Linear feet', type:'num'},
 ]},
 {group:'Crawl Space', items:[
   {id:'cs_clear', q:'Clearance height', type:'text'},
   {id:'cs_water', q:'Water leaks / pictures added?', type:'yn'},
   {id:'cs_elec', q:'Electrical present?', type:'yn'},
   {id:'cs_clutter', q:'Clutter?', type:'yn'},
   {id:'cs_dump', q:'Need dumpster?', type:'yn'},
   {id:'cs_movecharge', q:'Moving charge ($)', type:'num'},
   {id:'cs_door', q:'Crawl door', type:'choice', opts:['Repair','Replace','N/A']},
   {id:'cs_vents', q:'# of crawl vents', type:'num'},
   {id:'cs_beams', q:'Three beams or higher on all walls?', type:'yn'},
   {id:'cs_cement', q:'# of cement beams', type:'num'},
   {id:'cs_doorpic', q:'Picture of crawl door added?', type:'yn'},
 ]},
 {group:'Insulation', items:[
   {id:'in_driveway', q:'Pictures of driveway?', type:'yn'},
   {id:'in_dump', q:'Do we need a dumpster?', type:'yn'},
   {id:'in_dumploc', q:'Client-approved dumpster location', type:'text'},
   {id:'in_hills', q:'Steep hills/trees around driveway (detail)', type:'text'},
 ]},
];

/* service lines for tagging a job */
const SERVICE_LINES = ['Exclusion','Encapsulation','Attic Remediation','DSV','Borathor','Termite','Insulation'];

/* ---------------- State ---------------- */
/* DB.inspections = in-memory working copy (full records).
   Persistence = IndexedDB, one record per customer (keyed by id).
   IndexedDB has no practical size cap (hundreds of MB+), unlike
   localStorage's ~5MB — this is what lets jobs/photos grow freely. */
let DB = {inspections:[]};
let view = {name:'list', id:null, tab:'details'};
let _idb = null;
let _storageMode = 'idb'; // 'idb' | 'local' | 'memory'
const IDB_NAME = 'ecoshield_hub';
const IDB_STORE = 'inspections';
const IDB_VERSION = 1;
const LS_KEY = 'ecoshield_hub_records_v2';

function idbAvailable(){
  try{ return typeof indexedDB !== 'undefined' && indexedDB !== null; }catch(e){ return false; }
}

function idbOpen(){
  return new Promise((resolve,reject)=>{
    if(_idb) return resolve(_idb);
    if(!idbAvailable()){ reject(new Error('no-indexeddb')); return; }
    let req;
    try{ req = indexedDB.open(IDB_NAME, IDB_VERSION); }
    catch(e){ reject(e); return; }
    req.onupgradeneeded = e=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains(IDB_STORE)){
        db.createObjectStore(IDB_STORE, {keyPath:'id'});
      }
    };
    req.onsuccess = e=>{ _idb=e.target.result; resolve(_idb); };
    req.onerror = e=>reject((e.target&&e.target.error)||new Error('idb-open-failed'));
    req.onblocked = ()=>reject(new Error('idb-blocked'));
  });
}
async function idbGetAll(){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,'readonly');
    const req = tx.objectStore(IDB_STORE).getAll();
    req.onsuccess = ()=>resolve(req.result||[]);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbPut(rec){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(rec);
    tx.oncomplete = ()=>resolve(true);
    tx.onerror = ()=>reject(tx.error);
    tx.onabort = ()=>reject(tx.error||new Error('aborted'));
  });
}
async function idbDelete(id){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).delete(id);
    tx.oncomplete = ()=>resolve(true);
    tx.onerror = ()=>reject(tx.error);
  });
}

/* ---- localStorage fallback (per-record JSON map) ---- */
function lsReadAll(){
  try{ const r=localStorage.getItem(LS_KEY); return r? JSON.parse(r) : []; }catch(e){ return []; }
}
function lsWriteAll(arr){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(arr)); return true; }
  catch(e){ return false; }
}

/* ---- Unified persistence (dispatches by mode) ---- */
async function persistAll(){
  if(_storageMode==='memory') return true;
  if(_storageMode==='local') return lsWriteAll(DB.inspections);
  return true; // idb persists per-record via saveInsp
}
async function persistOne(insp){
  if(_storageMode==='idb'){
    try{ await idbPut(JSON.parse(JSON.stringify(insp))); return true; }
    catch(e){ /* fall through to local */ _storageMode='local'; }
  }
  if(_storageMode==='local'){ return lsWriteAll(DB.inspections); }
  return true; // memory: nothing to do
}
async function removeOne(id){
  if(_storageMode==='idb'){
    try{ await idbDelete(id); return true; }catch(e){ _storageMode='local'; }
  }
  if(_storageMode==='local'){ return lsWriteAll(DB.inspections); }
  return true;
}

/* one-time migration from any older localStorage data */
function migrateOldLocalStorage(intoArr){
  try{
    const r = localStorage.getItem('ecoshield_hub_v1');
    if(r){
      const old = JSON.parse(r);
      if(old && Array.isArray(old.inspections)){
        old.inspections.forEach(x=>intoArr.push(x));
      }
      localStorage.removeItem('ecoshield_hub_v1');
    }
  }catch(e){}
}

/* boot: choose a storage mode and load all records into memory */
async function bootDB(){
  // Try IndexedDB first
  if(idbAvailable()){
    try{
      const all = await idbGetAll();
      _storageMode='idb';
      DB.inspections = all;
      // migrate any legacy localStorage into idb
      const legacy=[]; migrateOldLocalStorage(legacy);
      if(legacy.length){ for(const x of legacy){ DB.inspections.push(x); try{await idbPut(x);}catch(e){} } }
      return;
    }catch(e){ /* fall back */ }
  }
  // Fall back to localStorage
  try{
    const arr = lsReadAll();
    migrateOldLocalStorage(arr);
    if(arr.length) lsWriteAll(arr);
    _storageMode='local';
    DB.inspections = arr;
    return;
  }catch(e){ /* fall back to memory */ }
  // Last resort: in-memory only (data lost on close — warn user)
  _storageMode='memory';
  DB.inspections = [];
}

/* persist a single inspection (debounced) */
let _saveTimers = {};
function saveInsp(insp){
  if(!insp) return;
  clearTimeout(_saveTimers[insp.id]);
  _saveTimers[insp.id] = setTimeout(()=>{ persistOne(insp); }, 250);
}
/* immediate (awaited) save */
async function saveInspNow(insp){
  clearTimeout(_saveTimers[insp.id]);
  return persistOne(insp);
}

function uid(){ return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function fmtDate(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${+m}/${+d}/${y.slice(2)}`; }

function newInspection(){
  return {
    id:uid(), customer:'', address:'', city:'', state:'GA', zip:'', phone:'',
    inspector:INSPECTOR, license:LICENSE, date:todayISO(),
    services:[], status:'draft', notes:'',

/* ---------------- Wiring ---------------- */
function wirePanel(i){
  // text/select fields
  document.querySelectorAll('[data-f]').forEach(el=>{
    el.addEventListener('input',()=>{ i[el.dataset.f]=el.value; touch(i); });
    el.addEventListener('change',()=>{ i[el.dataset.f]=el.value; touch(i);
      if(['customer','status'].includes(el.dataset.f)){ /* refresh title later */ } });
  });
  // service chips
  document.querySelectorAll('.svc').forEach(el=>{
    el.parentElement.addEventListener('click',e=>{
      e.preventDefault();
      const s=el.dataset.svc;
      const k=i.services.indexOf(s);
      if(k>=0) i.services.splice(k,1); else i.services.push(s);
      el.classList.toggle('on-gen');
      touch(i);
    });
  });
  // checklist yn
  document.querySelectorAll('[data-yn]').forEach(seg=>{
    seg.addEventListener('click',e=>{
      const b=e.target.closest('button'); if(!b) return;
      const id=seg.dataset.yn, val=b.dataset.v;
      i.checklist[id]=val; touch(i);
      seg.querySelectorAll('button').forEach(x=>x.className='');
      b.className = val==='yes'?'on-yes':val==='no'?'on-no':'on-na';
      refreshGroupCounts(i);
    });
  });
  // checklist choice
  document.querySelectorAll('[data-choice]').forEach(seg=>{
    seg.addEventListener('click',e=>{
      const b=e.target.closest('button'); if(!b) return;
      const id=seg.dataset.choice;
      i.checklist[id]=b.dataset.v; touch(i);
      seg.querySelectorAll('button').forEach(x=>x.className='');
      b.className='on-gen';
      refreshGroupCounts(i);
    });
  });
  // checklist text
  document.querySelectorAll('[data-cltext]').forEach(el=>{
    el.addEventListener('input',()=>{ i.checklist[el.dataset.cltext]=el.value; touch(i); });
    el.addEventListener('blur',()=>refreshGroupCounts(i));
  });
}
function refreshGroupCounts(i){
  document.querySelectorAll('.cl-group').forEach((gEl,idx)=>{
    const g=CHECKLIST_TEMPLATE[idx]; if(!g) return;
    const prog=groupProgress(i,g);
    const pct=gEl.querySelector('.pct'); if(pct) pct.textContent=`${prog.done}/${prog.total}`;
  });
}

/* ---------------- Progress helpers ---------------- */
function finalizeChecklist(id){
  const i=getInsp(id); if(!i) return;
  CHECKLIST_TEMPLATE.forEach(g=>g.items.forEach(it=>{
    const v=i.checklist[it.id];
    if(v===undefined||v===null||v===''){
      i.checklist[it.id] = (it.type==='yn') ? 'na' : 'N/A';
    }
  }));
  touch(i); renderPanel(); toast('Blanks set to N/A');
}
function isAnswered(it,v){
  if(v===undefined||v===null||v==='') return false;
  return true;
}
function groupProgress(i,g){
  let done=0;
  g.items.forEach(it=>{ if(isAnswered(it,i.checklist[it.id])) done++; });
  return {done,total:g.items.length};
}
function checklistProgress(i){
  let done=0,total=0;
  CHECKLIST_TEMPLATE.forEach(g=>g.items.forEach(it=>{ total++; if(isAnswered(it,i.checklist[it.id])) done++; }));
  return {done,total};
}

function compress(file){
  return new Promise((res,rej)=>{
    const img=new Image(), rd=new FileReader();
    rd.onload=()=>{ img.onload=()=>{
      const max=1280; let {width:w,height:h}=img;
      if(w>h && w>max){ h=h*max/w; w=max; } else if(h>max){ w=w*max/h; h=max; }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      res(c.toDataURL('image/jpeg',0.7));
    }; img.onerror=rej; img.src=rd.result; };
    rd.onerror=rej; rd.readAsDataURL(file);
  });
}

          <button class="btn btn-primary btn-wide" onclick='applyRestore(${JSON.stringify(JSON.stringify(data))},"merge")'>Merge with current</button>

          <button class="btn btn-ghost btn-wide" onclick="closeSheet()">Cancel</button>

async function applyRestore(dataStr,mode){
  const data=JSON.parse(dataStr);
  if(mode==='replace'){
    const oldIds=DB.inspections.map(x=>x.id);
    DB.inspections=[];
    for(const oid of oldIds){ await removeOne(oid); }
    for(const x of data.inspections){ DB.inspections.push(x); await persistOne(x); }
  } else {
    const ids=new Set(DB.inspections.map(x=>x.id));
    for(const x of data.inspections){ if(ids.has(x.id)) x.id=uid(); DB.inspections.push(x); await persistOne(x); }
  }
  closeSheet(); render(); toast('Restored');
}

/* ===========================================================================
   buildJobPDF — native print path (no external libraries).
   Builds a print-styled document: Graph → Photos(4-up) → Checklist,
   opens it, and triggers the browser print dialog. On iPhone:
   Share → Print → pinch-out → Save to Files as PDF → upload to FieldRoutes.
   =========================================================================== */
function buildJobPDF(id){
  const i=getInsp(id);
  if(!i){ toast('Job not found'); return; }
  const doc = buildPrintHTML(i);

  // iOS Safari blocks programmatic window.open from async contexts sometimes;
  // use a hidden iframe so it works in the installed PWA too.
  const existing = document.getElementById('printFrame');
  if(existing) existing.remove();
  const frame = document.createElement('iframe');
  frame.id = 'printFrame';
  frame.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;opacity:0;';
  document.body.appendChild(frame);

  const fdoc = frame.contentWindow.document;
  fdoc.open();
  fdoc.write(doc);
  fdoc.close();

  // Wait for images to load before printing
  const imgs = Array.from(fdoc.images || []);
  let pending = imgs.length;
  const go = ()=>{
    try{
      frame.contentWindow.focus();
      frame.contentWindow.print();
    }catch(e){
      // Fallback: open in a new tab the user can print manually
      const blob=new Blob([doc],{type:'text/html'});
      const url=URL.createObjectURL(blob);
      window.open(url,'_blank');
    }
    toast('Use Share → Save to Files (PDF)');
  };
  if(pending===0){ setTimeout(go, 150); return; }
  imgs.forEach(im=>{
    if(im.complete){ if(--pending===0) setTimeout(go,150); }
    else {
      im.addEventListener('load', ()=>{ if(--pending===0) setTimeout(go,150); });
      im.addEventListener('error', ()=>{ if(--pending===0) setTimeout(go,150); });
    }
  });
  // Safety: print anyway after 4s even if an image stalls
  setTimeout(()=>{ if(pending>0){ pending=0; go(); } }, 4000);
}

function buildPrintHTML(i){
  const fld = (v)=> v ? esc(v) : '';
  const addr = [i.address, [i.city, i.state, i.zip].filter(Boolean).join(' ')].filter(Boolean).join(', ');

  // ---- ONE document header (top of page 1 only) ----
  const topHeader = `
    <div class="doc-head">
      <div class="doc-brand"><span class="eco">eco</span><span class="shield">shield</span></div>
      <div class="doc-meta">
        <span class="doc-cust">${fld(i.customer)||'Inspection'}</span>
        ${addr?`<span class="doc-addr">${esc(addr)}</span>`:''}
        ${i.date?`<span class="doc-date">${esc(fmtDate(i.date))}</span>`:''}
      </div>
    </div>`;

  // ---- GRAPH ----
  let graphSection = '';
  if(i.graphHtml){
    const styleBlocks = (i.graphHtml.match(/<style[\s\S]*?<\/style>/gi)||[]).join('\n');
    const bodyMatch = i.graphHtml.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
    let gbody = bodyMatch ? bodyMatch[1] : '';
    const scriptTag = '<scr'+'ipt';
    const scriptClose = '</scr'+'ipt>';
    const scriptRe = new RegExp(scriptTag+'[\\s\\S]*?'+scriptClose,'gi');
    gbody = gbody.replace(scriptRe,'');
    graphSection = `
      <section class="sec sec-break">
        <div class="sec-title">WDI Graph</div>
        <div class="graph-host">${styleBlocks}${gbody}</div>
      </section>`;
  }

  // ---- PHOTOS (4 per page) ----
  let photoSection = '';
  if(i.photos.length){
    let pages = '';
    for(let p=0;p<i.photos.length;p+=4){
      const cells = i.photos.slice(p,p+4).map(ph=>`
        <div class="ph-cell">
          <img src="${ph.data}" alt="">
          ${ph.cap?`<div class="ph-cap">${esc(ph.cap)}</div>`:''}
        </div>`).join('');
      pages += `<div class="ph-page${p>0?' sec-break':''}">
        ${p===0?'<div class="sec-title">Property Photos</div>':''}
        <div class="ph-grid">${cells}</div>
      </div>`;
    }
    photoSection = `<section class="sec sec-break">${pages}</section>`;
  }

  // ---- CHECKLIST ----
  const clRows = CHECKLIST_TEMPLATE.map(g=>{
    const rows = g.items.map(it=>{
      const v = i.checklist[it.id];
      let disp, cls;
      if(v===undefined||v===null||v===''){ disp = it.type==='yn'?'N/A':'—'; cls='val-na'; }
      else if(it.type==='yn'){ disp = v==='yes'?'YES':v==='no'?'NO':'N/A'; cls = v==='yes'?'val-yes':v==='no'?'val-no':'val-na'; }
      else { disp = esc(String(v)); cls='val-txt'; }
      return `<tr><td class="q">${esc(it.q)}</td><td class="v ${cls}">${disp}</td></tr>`;
    }).join('');
    return `<div class="cl-grp"><div class="cl-grp-h">${esc(g.group)}</div>
      <table class="cl-tbl">${rows}</table></div>`;
  }).join('');

  const checklistSection = `
    <section class="sec sec-break">
      <div class="sec-title">BSP Checklist</div>
      <div class="cl-wrap">${clRows}</div>
      <div class="cl-foot">
        <span>Inspector: ${esc(i.inspector)}</span>
        <span>License: ${esc(i.license)}</span>
      </div>
    </section>`;

  return `<!DOCTYPE html><html><head><meta charset="UTF-8">
  <title>${fld(i.customer)||'Inspection'} — EcoShield</title>
  <style>
    @page { size: letter; margin: 0.4in; }
    *{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    body{margin:0;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;color:#1a1a1a;font-size:11px;}
    /* one header, top of doc only */
    .doc-head{display:flex;justify-content:space-between;align-items:baseline;
      border-bottom:2px solid #3d8b37;padding-bottom:6px;margin-bottom:12px;}
    .doc-brand{font-size:18px;font-weight:800;letter-spacing:-.5px;}
    .doc-brand .eco{color:#1a1a1a;}.doc-brand .shield{color:#3d8b37;}
    .doc-meta{text-align:right;font-size:10px;color:#444;line-height:1.4;}
    .doc-cust{font-weight:700;display:block;font-size:12px;color:#1a1a1a;}
    .doc-addr{display:block;}.doc-date{display:block;color:#888;}
    /* sections */
    .sec{margin-bottom:16px;}
    .sec-break{page-break-before:always;break-before:page;}
    .sec-title{background:#3d8b37;color:#fff;font-weight:700;font-size:12px;text-transform:uppercase;
      letter-spacing:.4px;padding:6px 10px;border-radius:4px;margin-bottom:10px;}
    /* graph */
    .graph-host{width:100%;}
    /* photos */
    .ph-page{page-break-inside:avoid;}
    .ph-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;height:8.8in;}
    .ph-cell{border:1px solid #ddd;border-radius:6px;overflow:hidden;display:flex;flex-direction:column;background:#fafafa;}
    .ph-cell img{width:100%;height:100%;object-fit:contain;flex:1;min-height:0;}
    .ph-cap{font-size:9px;color:#555;text-align:center;padding:3px;border-top:1px solid #eee;background:#fff;}
    /* checklist — keep groups whole */
    .cl-grp{margin-bottom:10px;page-break-inside:avoid;break-inside:avoid;}
    .cl-grp-h{background:#3d8b37;color:#fff;font-weight:700;font-size:11px;text-transform:uppercase;
      padding:5px 8px;border-radius:4px 4px 0 0;letter-spacing:.3px;}
    .cl-tbl{width:100%;border-collapse:collapse;font-size:10.5px;}
    .cl-tbl td{padding:5px 8px;border-bottom:1px solid #eee;vertical-align:top;}
    .cl-tbl td.q{width:62%;color:#333;}
    .cl-tbl td.v{text-align:right;font-weight:700;}
    .val-yes{color:#2f6e2a;}.val-no{color:#c0392b;}.val-na{color:#999;}.val-txt{color:#1b3a8c;}
    .cl-foot{display:flex;justify-content:space-between;border-top:1px solid #3d8b37;
      margin-top:10px;padding-top:8px;font-weight:700;font-size:10px;color:#444;}
    /* first section after header shouldn't force a page break */
    .sec:first-of-type{page-break-before:auto;break-before:auto;}
  </style></head>
  <body>
    ${topHeader}
    ${graphSection}
    ${photoSection}
    ${checklistSection}
  </body></html>`;
}
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800); }
function sheet(html){ document.getElementById('sheet').innerHTML=html; document.getElementById('overlay').classList.add('show'); }
function closeSheet(){ document.getElementById('overlay').classList.remove('show'); }
document.getElementById('overlay').addEventListener('click',e=>{ if(e.target.id==='overlay') closeSheet(); });

/* refresh title when leaving details edits */
document.addEventListener('focusout',()=>{ if(view.name==='detail'){ const i=getInsp(view.id); const t=document.querySelector('.title-lg'); if(i&&t) t.textContent=i.customer||'New Inspection'; }});

/* ---------------- Boot ---------------- */
(async function boot(){
  try{ await bootDB(); }
  catch(e){ console.error('DB init failed', e); _storageMode='memory'; DB.inspections=DB.inspections||[]; }
  render();
  if(_storageMode==='memory'){
    setTimeout(()=>toast('Storage blocked here — use Backup to save your work'), 600);
  } else if(_storageMode==='local'){
    // localStorage works but has size limits; silent, Backup still available
  }
})();
</script>
</body>
</html>
